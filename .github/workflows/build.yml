name: Verify development build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-dev nlohmann-json3-dev cppcheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM startup test dependencies
        run: python3 -m pip install -r tools/requirements-arm-smoke.txt
      - name: Native tests and ARM inspection
        run: make verify
      - name: Static analysis
        run: make static-check
      - name: Package development preview
        run: |
          mkdir -p build/package/programs/plug-ins build/package/programs/helper
          cp plugins/patch_helper.o build/package/programs/plug-ins/
          cp helper/ThPh.lua build/package/programs/helper/
          cp README.md build/package/
          cd build/package
          zip -r ../../patch_helper-preview.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: patch-helper-development-preview
          path: patch_helper-preview.zip
