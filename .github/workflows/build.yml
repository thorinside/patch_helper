name: Verify and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libstdc++-arm-none-eabi-dev nlohmann-json3-dev cppcheck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ARM startup test dependencies
        run: python3 -m pip install -r tools/requirements-arm-smoke.txt
      - name: Native tests and ARM inspection
        run: make verify
      - name: Static analysis
        run: make static-check
      - name: Package plugin and companion
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: patch-helper-package
          path: build/patch_helper.zip
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patch-helper-package
          path: build
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" build/patch_helper.zip \
            --verify-tag "${flags[@]}" --title "Patch Helper $RELEASE_TAG" \
            --notes-file .github/release-notes.md
